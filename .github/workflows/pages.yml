name: Deploy Elevator Tales to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify game rules
        run: npm run verify

      - name: Build static game
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /Elevator-Tales
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          if [ -d dist/client/Elevator-Tales/_next ]; then
            mv dist/client/Elevator-Tales/_next dist/client/_next
            rmdir dist/client/Elevator-Tales
          fi
          touch dist/client/.nojekyll
          test -f dist/client/index.html
          test -d dist/client/_next

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
